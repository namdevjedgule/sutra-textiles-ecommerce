          </g>`
                        : `<g ${g}>
            <path d="M168 96H232L246 170Q200 196 154 170Z"/>
            <path d="M150 214H250L252 232H148Z"/>
            <path d="M148 232H252L336 452Q200 486 64 452Z"/>
            <path d="M120 330Q200 350 280 330M96 392Q200 414 304 392M70 440Q200 474 330 440" fill="none"/>
            <path d="M232 100C300 140 330 260 300 330" fill="none"/>
          </g>`;
                } else {
                    const longKurta = category === 'regional';
                    const hem = longKurta ? 380 : 340;
                    body = view === 'back'
                        ? `<g ${g}>
            <path d="M146 100H254L${longKurta ? 274 : 282} ${hem}H${longKurta ? 126 : 118}Z"/>
            <path d="M180 100Q200 108 220 100M200 108V${hem}" fill="none" stroke-opacity=".6"/>
            <path d="M146 100 102 190 126 204 150 150M254 100 298 190 274 204 250 150"/>
            ${longKurta ? `<path d="M150 ${hem}L146 470M250 ${hem}L254 470" fill="none"/>` : `<path d="M124 ${hem}H276L316 470H218L200 396 182 470H84Z"/>`}
          </g>`
                        : `<g ${g}>
            <path d="M146 100H254L${longKurta ? 274 : 282} ${hem}H${longKurta ? 126 : 118}Z"/>
            <path d="M178 100Q200 132 222 100" fill="none"/>
            <path d="M146 100 102 190 126 204 150 150M254 100 298 190 274 204 250 150"/>
            ${longKurta ? `<path d="M150 ${hem}L146 470M250 ${hem}L254 470" fill="none"/>` : `<path d="M124 ${hem}H276L316 470H218L200 396 182 470H84Z"/>`}
            <path d="M232 104C320 150 340 280 296 ${longKurta ? 400 : 400}" fill="none"/>
            <path d="M${longKurta ? 126 : 118} ${hem - 22}H${longKurta ? 274 : 282}" fill="none" stroke-opacity=".6"/>
          </g>`;
                }

                return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bgA}"/><stop offset="1" stop-color="${bgB}"/></linearGradient></defs>
      <rect width="400" height="500" fill="url(#${id}g)"/>${body}</svg>`;
            }

            function getSlides() {
                const imgs = p.images && (p.images[state.color] || p.images.default);
                if (imgs && imgs.length) {
                    return imgs.map((src, i) => ({ kind: 'img', src, label: `View ${i + 1}` }));
                }
                const labels = VIEW_LABELS[p.category] || VIEW_LABELS.default;
                return ['front', 'back', 'detail', 'motif'].map((view, i) => ({ kind: 'art', view, label: labels[i] }));
            }
            function currentHex() { const c = p.colors.find(c => c.name === state.color); return c ? c.hex : p.colors[0].hex; }
            function slideHTML(s) {
                return s.kind === 'img'
                    ? `<img src="${esc(s.src)}" alt="${esc(p.name)} \u2014 ${esc(s.label)}" loading="lazy">`
                    : artSvg(s.view, currentHex(), p.category);
            }

            /* ===========================================================
               GALLERY
               =========================================================== */
            const frame = $('#pdFrame'), slideEl = $('#pdSlide'), thumbsEl = $('#pdThumbs');

            function renderThumbs() {
                thumbsEl.innerHTML = slides.map((s, i) =>
                    `<button type="button" class="pd-thumb${i === state.view ? ' is-active' : ''}" data-i="${i}" aria-label="Show ${esc(s.label)}" aria-current="${i === state.view}">${slideHTML(s)}</button>`
                ).join('');
            }
            function showSlide(i, animate = true) {
                state.view = (i + slides.length) % slides.length;
                slideEl.innerHTML = slideHTML(slides[state.view]);
                slideEl.classList.remove('pd-fade');
                if (animate && !reduceMotion) { void slideEl.offsetWidth; slideEl.classList.add('pd-fade'); }
                $$('.pd-thumb', thumbsEl).forEach((t, idx) => {
                    t.classList.toggle('is-active', idx === state.view);
                    t.setAttribute('aria-current', String(idx === state.view));
                });
                $('#pdCounter').textContent = `${state.view + 1} / ${slides.length}`;
                $('#pdViewLabel').textContent = slides[state.view].label;
                $('#pdPrev').hidden = $('#pdNext').hidden = slides.length < 2;
            }
            function renderGallery() {
                slides = getSlides();
                state.view = Math.min(state.view, slides.length - 1);
                renderThumbs();
                showSlide(state.view, false);
            }

            const tagText = p.tag || (cat.discount(p) >= 18 ? 'Special price' : '');
            if (tagText) { const t = $('#pdTag'); t.textContent = tagText; t.hidden = false; }

            thumbsEl.addEventListener('click', e => { const b = e.target.closest('.pd-thumb'); if (b) showSlide(Number(b.dataset.i)); });
            $('#pdPrev').addEventListener('click', () => showSlide(state.view - 1));
            $('#pdNext').addEventListener('click', () => showSlide(state.view + 1));
            frame.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft') { e.preventDefault(); showSlide(state.view - 1); }
                if (e.key === 'ArrowRight') { e.preventDefault(); showSlide(state.view + 1); }
                if (e.key === 'Enter' && e.target === frame) openLightbox();
            });
            frame.addEventListener('click', e => { if (!e.target.closest('button')) openLightbox(); });
            $('#pdExpand').addEventListener('click', openLightbox);

            // hover zoom (mouse only)
            const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            if (canHover) {
                frame.addEventListener('mousemove', e => {
                    if (e.target.closest('button')) { frame.classList.remove('is-zooming'); return; }
                    const r = frame.getBoundingClientRect();
                    slideEl.style.setProperty('--zx', ((e.clientX - r.left) / r.width * 100) + '%');
                    slideEl.style.setProperty('--zy', ((e.clientY - r.top) / r.height * 100) + '%');
                    frame.classList.add('is-zooming');
                });
                frame.addEventListener('mouseleave', () => frame.classList.remove('is-zooming'));
            }
            // swipe (touch)
            let touchX = null;
            frame.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
            frame.addEventListener('touchend', e => {
                if (touchX === null) return;
                const dx = e.changedTouches[0].clientX - touchX;
                touchX = null;
                if (Math.abs(dx) > 40) showSlide(state.view + (dx < 0 ? 1 : -1));
            }, { passive: true });

            /* ===========================================================
               LIGHTBOX
               =========================================================== */
            const lb = $('#lightbox'), lbStage = $('#lbStage'), lbSlide = $('#lbSlide');
            let lbReturnFocus = null;

            function lbRender() {
                lbSlide.innerHTML = slideHTML(slides[state.view]);
                $('#lbCounter').textContent = `${slides[state.view].label}  \u00B7  ${state.view + 1} / ${slides.length}`;
                $('#lbThumbs').innerHTML = slides.map((s, i) =>
                    `<button type="button" class="pd-thumb${i === state.view ? ' is-active' : ''}" data-i="${i}" aria-label="Show ${esc(s.label)}">${slideHTML(s)}</button>`
                ).join('');
                $('#lbPrev').hidden = $('#lbNext').hidden = slides.length < 2;
            }
            function lbGo(i) {
                state.view = (i + slides.length) % slides.length;
                setZoom(false);
                lbRender();
                showSlide(state.view, false);
            }
            function setZoom(on) {
                lbStage.classList.toggle('is-zoomed', on);
                $('#lbZoom').setAttribute('aria-pressed', String(on));
            }
            function openLightbox() {
                lbReturnFocus = document.activeElement;
                setZoom(false);
                lbRender();
                lb.hidden = false;
                document.body.style.overflow = 'hidden';
                $('#lbClose').focus();
            }
            function closeLightbox() {
                lb.hidden = true;
                document.body.style.overflow = '';
                frame.classList.remove('is-zooming');
                if (lbReturnFocus && lbReturnFocus.focus) lbReturnFocus.focus();
            }
            $('#lbClose').addEventListener('click', closeLightbox);
            $('#lbPrev').addEventListener('click', () => lbGo(state.view - 1));
            $('#lbNext').addEventListener('click', () => lbGo(state.view + 1));
            $('#lbZoom').addEventListener('click', () => setZoom(!lbStage.classList.contains('is-zoomed')));
            lbSlide.addEventListener('click', () => setZoom(!lbStage.classList.contains('is-zoomed')));
            lbSlide.addEventListener('mousemove', e => {
                if (!lbStage.classList.contains('is-zoomed')) return;
                const r = lbSlide.getBoundingClientRect();
                lbSlide.style.setProperty('--zx', ((e.clientX - r.left) / r.width * 100) + '%');
                lbSlide.style.setProperty('--zy', ((e.clientY - r.top) / r.height * 100) + '%');
            });
            lbStage.style.setProperty('--zx', '50%');
            $('#lbThumbs').addEventListener('click', e => { const b = e.target.closest('.pd-thumb'); if (b) lbGo(Number(b.dataset.i)); });
            lb.addEventListener('click', e => { if (e.target === lbStage) closeLightbox(); });
            document.addEventListener('keydown', e => {
                if (lb.hidden) return;
                if (e.key === 'Escape') closeLightbox();
                else if (e.key === 'ArrowLeft') lbGo(state.view - 1);
                else if (e.key === 'ArrowRight') lbGo(state.view + 1);
                else if (e.key === 'Tab') {
                    const f = $$('button:not([hidden])', lb);
                    if (!f.length) return;
                    const first = f[0], last = f[f.length - 1];
                    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                }
            });

            /* ===========================================================
               REVIEWS DATA (mock seed + reviews written on this device)
               =========================================================== */
            const POOL = [
                ['Ritika S.', 'Pune', 5, 'Looks even better in person', x => `The colour matches the photos and the ${x.fabric.toLowerCase()} feels premium. Packed neatly and arrived on time.`],
                ['Meera K.', 'Hyderabad', 5, 'Worth every rupee', x => `I was unsure about ordering ethnic wear online, but the finish on the ${x.work.toLowerCase()} is lovely. Got compliments all evening.`],
                ['Harleen B.', 'Delhi', 4, 'Lovely, slightly different shade', () => 'Beautiful piece and neat stitching. The shade is a touch deeper than on my screen, but I like it.'],
                ['Ananya D.', 'Kolkata', 5, 'Exactly what I wanted', () => 'Fits well and the fabric falls nicely. Delivery was quicker than I expected.'],
                ['Priya N.', 'Chennai', 4, 'Good quality for the price', () => 'The fabric and finishing are better than I expected at this price. Would order again.'],
                ['Kavya R.', 'Bengaluru', 3, 'Good, but check the size guide', () => 'Lovely fabric. I went a size down and it was snug \u2014 the size guide is accurate, so do measure first.'],
                ['Sneha P.', 'Mumbai', 5, 'A festive favourite', () => 'Wore it for Diwali and it was perfect. It looks rich without feeling heavy.'],
                ['Aditi M.', 'Jaipur', 4, 'Pretty and comfortable', () => 'Comfortable to wear all day and the detailing is neat. Support also helped with a delivery query quickly.'],
                ['Nandini V.', 'Ahmedabad', 5, 'Beautiful craftsmanship', () => 'The detailing is neat on both sides. A very elegant piece.']
            ];
            const DAYS_AGO = [4, 12, 27, 49, 83, 131];
            const HELPFUL_SEED = [11, 6, 3, 8, 2, 4];

            function seededReviews() {
                const start = p.id % POOL.length;
                return DAYS_AGO.map((d, i) => {
                    const row = POOL[(start + i * 2) % POOL.length];
                    return {
                        id: `${p.id}-s${i}`, name: row[0], city: row[1], rating: row[2], title: row[3], body: row[4](p),
                        ts: Date.now() - d * 864e5, verified: true, mine: false, helpful: HELPFUL_SEED[i],
                        size: p.sizes.length > 1 ? p.sizes[(i + 1) % p.sizes.length].label : null
                    };
                });
            }
            const USER_KEY = 'sutra_user_reviews_v1';
            const HELPFUL_KEY = 'sutra_helpful_v1';
            const userReviews = () => (Sutra.store.read(USER_KEY, {})[p.id] || []);
            const allReviews = () => seededReviews().concat(userReviews());

            const rv = { filter: 0, sort: 'recent', visible: 4 };
            const fmtDate = (ts) => new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(ts));
            const starsHTML = (avg) => `<span class="stars" style="--pct:${(avg / 5 * 100).toFixed(1)}%" aria-hidden="true">\u2605\u2605\u2605\u2605\u2605</span>`;

            function ratingSummary() {
                const list = allReviews();
                const avg = list.reduce((s, r) => s + r.rating, 0) / list.length;
                return { list, avg, n: list.length };
            }

            function renderRatingRow() {
                const { avg, n } = ratingSummary();
                const el = $('#pdRating');
                if (el) el.innerHTML = `${starsHTML(avg)}<span class="pd-rating-text">${avg.toFixed(1)} \u00B7 ${n} review${n === 1 ? '' : 's'}</span>`;
                updateSchema();
            }

            function renderReviews() {
                const { list, avg, n } = ratingSummary();
                $('#rvScore').innerHTML = `${avg.toFixed(1)}<small> / 5</small>`;
                $('#rvStars').innerHTML = starsHTML(avg);
                $('#rvMeta').textContent = `Based on ${n} review${n === 1 ? '' : 's'}`;

                const counts = [5, 4, 3, 2, 1].map(s => ({ s, c: list.filter(r => r.rating === s).length }));
                $('#rvBars').innerHTML = counts.map(({ s, c }) => `
      <button type="button" class="rv-bar${rv.filter === s ? ' is-active' : ''}" data-star="${s}" aria-pressed="${rv.filter === s}" aria-label="${s} star reviews: ${c}">
        <span>${s} \u2605</span><span class="rv-track"><span class="rv-fill" style="width:${(c / n * 100).toFixed(0)}%"></span></span><span>${c}</span>
      </button>`).join('');

                let shown = rv.filter ? list.filter(r => r.rating === rv.filter) : list.slice();
                const helpedSet = new Set(Sutra.store.read(HELPFUL_KEY, []));
                const helpfulCount = (r) => r.helpful + (helpedSet.has(r.id) ? 1 : 0);
                shown.sort((a, b) => ({
                    recent: b.ts - a.ts,
                    helpful: helpfulCount(b) - helpfulCount(a),
                    high: b.rating - a.rating || b.ts - a.ts,
                    low: a.rating - b.rating || b.ts - a.ts
                }[rv.sort]));

                const total = shown.length;
                shown = shown.slice(0, rv.visible);
                $('#rvShowing').textContent = total ? `Showing ${shown.length} of ${total}` : 'No reviews match this filter';
                $('#rvClear').hidden = !rv.filter;
                $('#rvMore').parentElement.hidden = total <= rv.visible;

                $('#rvList').innerHTML = shown.map(r => `
      <article class="rv-item" data-id="${esc(r.id)}">
        <div class="rv-avatar" aria-hidden="true">${esc(r.name.trim().charAt(0).toUpperCase())}</div>
        <div>
          <div class="rv-who">
            <strong>${esc(r.name)}</strong>
            ${r.city ? `<span>${esc(r.city)}</span>` : ''}
            <span class="rv-badge${r.mine ? ' mine' : ''}">${r.mine ? 'Your review' : 'Verified buyer'}</span>
          </div>
          <div class="rv-line">${starsHTML(r.rating)}<span>${fmtDate(r.ts)}</span>${r.size ? `<span>Size: ${esc(r.size)}</span>` : ''}</div>
          <h3 class="rv-title">${esc(r.title)}</h3>
          <p class="rv-body">${esc(r.body)}</p>
          <div class="rv-actions">
            <button type="button" data-helpful="${esc(r.id)}" aria-pressed="${helpedSet.has(r.id)}">Helpful (${helpfulCount(r)})</button>
            ${r.mine ? `<button type="button" data-delete="${esc(r.id)}">Delete</button>` : ''}
          </div>
        </div>
      </article>`).join('');
            }

            $('#rvBars').addEventListener('click', e => {
                const b = e.target.closest('.rv-bar'); if (!b) return;
                const s = Number(b.dataset.star);
                rv.filter = rv.filter === s ? 0 : s; rv.visible = 4; renderReviews();
            });
            $('#rvClear').addEventListener('click', () => { rv.filter = 0; rv.visible = 4; renderReviews(); });
            $('#rvSort').addEventListener('change', e => { rv.sort = e.target.value; renderReviews(); });
            $('#rvMore').addEventListener('click', () => { rv.visible += 4; renderReviews(); });
            $('#rvList').addEventListener('click', e => {
                const h = e.target.closest('[data-helpful]');
                if (h) {
                    const set = new Set(Sutra.store.read(HELPFUL_KEY, []));
                    const id = h.dataset.helpful;
                    set.has(id) ? set.delete(id) : set.add(id);
                    Sutra.store.write(HELPFUL_KEY, Array.from(set));
                    renderReviews();
                    return;
                }
                const d = e.target.closest('[data-delete]');
                if (d && window.confirm('Delete your review?')) {
                    const store = Sutra.store.read(USER_KEY, {});
                    store[p.id] = (store[p.id] || []).filter(r => r.id !== d.dataset.delete);
                    Sutra.store.write(USER_KEY, store);
                    renderReviews(); renderRatingRow();
                }
            });

            /* ---- Write a review ---- */
            const formWrap = $('#rvFormWrap'), form = $('#rvForm'), writeBtn = $('#rvWriteBtn');
            function toggleForm(open) {
                formWrap.hidden = !open;
                writeBtn.setAttribute('aria-expanded', String(open));
                if (open) {
                    $('#rvName').value = Sutra.store.read('sutra_reviewer_v1', { name: '', city: '' }).name || '';
                    $('#rvCity').value = Sutra.store.read('sutra_reviewer_v1', { name: '', city: '' }).city || '';
                    formWrap.scrollIntoView({ behavior: smooth, block: 'center' });
                    $('#rvName').focus({ preventScroll: true });
                }
            }
            writeBtn.addEventListener('click', () => toggleForm(formWrap.hidden));
            $('#rvCancel').addEventListener('click', () => toggleForm(false));
            $('#rvBody').addEventListener('input', e => { $('#rvCharCount').textContent = e.target.value.length; });

            form.addEventListener('submit', e => {
                e.preventDefault();
                const rating = Number((form.querySelector('input[name="rating"]:checked') || {}).value || 0);
                const name = $('#rvName').value.trim(), city = $('#rvCity').value.trim();
                const title = $('#rvTitle').value.trim(), body = $('#rvBody').value.trim();
                const errs = {
                    errRating: rating ? '' : 'Please choose a star rating.',
                    errName: name ? '' : 'Please enter your name.',
                    errTitle: title.length >= 3 ? '' : 'Please add a short title (3+ characters).',
                    errBody: body.length >= 20 ? '' : 'Please write at least 20 characters.'
                };
                Object.keys(errs).forEach(k => { $('#' + k).textContent = errs[k]; });
                if (Object.values(errs).some(Boolean)) return;

                const review = {
                    id: 'u-' + Date.now(), name, city, rating, title, body, ts: Date.now(),
                    verified: false, mine: true, helpful: 0, size: state.size
                };
                const store = Sutra.store.read(USER_KEY, {});
                store[p.id] = [review].concat(store[p.id] || []);
                Sutra.store.write(USER_KEY, store);
                Sutra.store.write('sutra_reviewer_v1', { name, city });
                form.reset(); $('#rvCharCount').textContent = '0';
                rv.filter = 0; rv.sort = 'recent'; $('#rvSort').value = 'recent';
                toggleForm(false);
                renderReviews(); renderRatingRow();
                $('#rvList').scrollIntoView({ behavior: smooth, block: 'start' });
                Sutra.toast('Thank you \u2014 your review has been added');
            });

            /* ===========================================================
               INFO COLUMN
               =========================================================== */
            const info = $('#pdInfo');
            const discount = cat.discount(p);

            function sizeGuideLabel() { return p.category === 'sarees' ? 'Saree dimensions' : 'Size guide'; }

            info.innerHTML = `
    <div class="pd-eyebrow">
      <span>${esc(cat.regionLabel(p.region)).toUpperCase()}</span><i aria-hidden="true"></i>
      <a href="shop.html?cat=${p.category}">${esc(cat.categoryLabel(p.category)).toUpperCase()}</a>
    </div>
    <h1 class="pd-title">${esc(p.name)}</h1>
    <a class="pd-rating" id="pdRating" href="#reviews"></a>

    <div class="pd-price-row">
      <span class="pd-price" id="pdPrice">${money(p.price)}</span>
      ${discount ? `<s class="pd-mrp" aria-label="Original price">${money(p.mrp)}</s><span class="pd-off">${discount}% OFF</span>` : ''}
    </div>
    <p class="pd-tax" id="pdTax"></p>
    <p class="pd-blurb">${esc(p.description)}</p>

    <hr class="pd-divider">

    <div class="pd-field" style="margin-top:0">
      <div class="pd-label"><span>Colour: <strong id="pdColorName">${esc(state.color)}</strong></span></div>
      <div class="pd-swatches" role="radiogroup" aria-label="Colour">
        ${p.colors.map(c => `<button type="button" class="pd-swatch" role="radio" aria-checked="${c.name === state.color}" aria-label="${esc(c.name)}" title="${esc(c.name)}" data-color="${esc(c.name)}" style="--sw:${c.hex}"></button>`).join('')}
      </div>
    </div>

    <div class="pd-field" id="pdSizeField">
      <div class="pd-label">
        <span>Size: <strong id="pdSizeName">${state.size ? esc(state.size) : 'Select a size'}</strong></span>
        <button type="button" class="pd-link" id="pdSizeGuide">${sizeGuideLabel()}</button>
      </div>
      <div class="pd-sizes" id="pdSizes" role="radiogroup" aria-label="Size">
        ${p.sizes.map(s => `<button type="button" class="pd-size" role="radio" data-size="${esc(s.label)}" aria-checked="${s.label === state.size}" ${p.stock === 'in-stock' && s.qty === 0 ? 'disabled title="Out of stock"' : ''}>${esc(s.label)}</button>`).join('')}
      </div>
      <p class="pd-error" id="pdSizeError" role="alert"></p>
      <p class="pd-lowstock" id="pdLowStock"></p>
    </div>

    <p class="pd-avail ${p.stock === 'made-to-order' ? 'is-mto' : ''}" id="pdAvail"></p>

    <div class="pd-buy" id="pdBuy">
      <div class="pd-qty" role="group" aria-label="Quantity">
        <button type="button" id="pdQtyMinus" aria-label="Decrease quantity">&minus;</button>
        <output id="pdQty" aria-live="polite">1</output>
        <button type="button" id="pdQtyPlus" aria-label="Increase quantity">+</button>
      </div>
      <button type="button" class="pd-btn-add" id="pdAdd">Add to Cart</button>
      <button type="button" class="pd-wish" id="pdWish" aria-pressed="false" aria-label="Save to wishlist">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-9.5-8.8C.8 7.8 2.6 4 6.3 4 8.6 4 10.6 5.3 12 7.2 13.4 5.3 15.4 4 17.7 4c3.7 0 5.5 3.8 3.8 7.2C19 15.7 12 20 12 20Z"/></svg>
      </button>
      <button type="button" class="pd-btn-now" id="pdBuyNow">Buy Now</button>
    </div>

    <div class="pd-secondary">
      <button type="button" id="pdShare"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/></svg>Share</button>
      <a href="contact.html" class="pd-secondary-link" style="display:inline-flex;gap:.45rem;align-items:center;color:var(--olive)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4Z"/></svg>Ask about this piece</a>
    </div>

    <div class="pd-delivery">
      <h3>CHECK DELIVERY</h3>
      <form class="pd-pin" id="pdPinForm" novalidate>
        <input type="text" id="pdPin" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pincode" aria-label="Delivery pincode" autocomplete="postal-code">
        <button type="submit">Check</button>
      </form>
      <p class="pd-pin-result" id="pdPinResult" role="status"></p>
    </div>

    <ul class="pd-trust">
      <li><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>Made in-house in Bhilwara</li>
      <li><svg viewBox="0 0 24 24"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7M6.5 18.5a1.5 1.5 0 1 0 0 .01M17.5 18.5a1.5 1.5 0 1 0 0 .01"/></svg>Free shipping above ${money(FREE_SHIP)}</li>
      <li><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Easy returns &amp; exchange</li>
    </ul>

    <div class="pd-acc">
      <details open>
        <summary>Description</summary>
        <div class="pd-acc-body">
          <p>${esc(p.description)}</p>
          <ul class="pd-list">${p.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
          <p style="margin-top:.9rem"><strong style="font-weight:500">Set includes:</strong> ${esc(p.includes)}</p>
        </div>
      </details>
      <details>
        <summary>Fabric &amp; Care</summary>
        <div class="pd-acc-body">
          <table class="pd-spec">
            <tr><th>Fabric</th><td>${esc(p.fabric)}</td></tr>
            <tr><th>Work</th><td>${esc(p.work)}</td></tr>
            <tr><th>Colour</th><td id="pdSpecColor">${esc(state.color)}</td></tr>
          </table>
          <ul class="pd-list">${p.care.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
          <p style="margin-top:.9rem;font-size:.84rem;color:var(--olive)">Slight variations in shade are natural \u2014 screens display colour differently.</p>
        </div>
      </details>
      <details>
        <summary>Shipping &amp; Returns</summary>
        <div class="pd-acc-body">
          <ul class="pd-list">
            <li>We ship across India. Shipping is free on orders above ${money(FREE_SHIP)}.</li>
            <li>${p.stock === 'made-to-order'
                    ? `This piece is made to order and dispatches in ${p.dispatchDays[0]}\u2013${p.dispatchDays[1]} days.`
                    : `Ready stock dispatches in ${p.dispatchDays[0]}\u2013${p.dispatchDays[1]} days.`}</li>
            <li>Easy returns and exchanges \u2014 see our <a class="pd-link" href="returns-policy.html">Returns &amp; Exchange Policy</a> for eligibility and timelines.</li>
            <li>Delivery details: <a class="pd-link" href="shipping-policy.html">Shipping &amp; Delivery Policy</a>.</li>
          </ul>
        </div>
      </details>
      <details>
        <summary>Product Details</summary>
        <div class="pd-acc-body">
          <table class="pd-spec">
            <tr><th>Product code</th><td>${esc(p.sku)}</td></tr>
            <tr><th>Category</th><td>${esc(cat.categoryLabel(p.category))}</td></tr>
            <tr><th>Region</th><td>${esc(cat.regionLabel(p.region))}</td></tr>
            <tr><th>Occasion</th><td>${esc(p.occasion)}</td></tr>
            <tr><th>Made by</th><td>Sutra Textiles India, Bhilwara, Rajasthan</td></tr>
            <tr><th>Country of origin</th><td>India</td></tr>
          </table>
        </div>
      </details>
    </div>`;

            /* ---------- Variant logic ---------- */
            function sizeQty() {
                if (!state.size) return null;
                const s = p.sizes.find(s => s.label === state.size);
                return s ? s.qty : null;
            }
            function maxQty() {
                const q = sizeQty();
                return p.stock === 'in-stock' && q ? Math.min(Sutra.cart.MAX_QTY, q) : Sutra.cart.MAX_QTY;
            }

            function updateBuyState() {
                const max = maxQty();
                state.qty = Math.max(1, Math.min(state.qty, max));
                $('#pdQty').textContent = state.qty;
                $('#pdQtyMinus').disabled = state.qty <= 1;
                $('#pdQtyPlus').disabled = state.qty >= max;

                const total = p.price * state.qty;
                $('#pdTax').textContent = 'Inclusive of all taxes' +
                    (state.qty > 1 ? ` \u00B7 Total for ${state.qty}: ${money(total)}` : '') +
                    (total >= FREE_SHIP ? ' \u00B7 Free shipping' : '');

                const q = sizeQty();
                $('#pdLowStock').textContent = (p.stock === 'in-stock' && q > 0 && q <= 3) ? `Only ${q} left in size ${state.size} \u2014 order soon.` : '';
                $('#pdAvail').textContent = p.stock === 'made-to-order'
                    ? `Made to order \u00B7 dispatches in ${p.dispatchDays[0]}\u2013${p.dispatchDays[1]} days`
                    : `In stock \u00B7 dispatches in ${p.dispatchDays[0]}\u2013${p.dispatchDays[1]} days`;
                $('#pdSizeName').textContent = state.size || 'Select a size';
                $('#pdStickyPrice').textContent = `${money(p.price)}${state.size && cat.needsSize(p) ? ' \u00B7 Size ' + state.size : ''}`;
            }

            $('#pdSizes').addEventListener('click', e => {
                const b = e.target.closest('.pd-size'); if (!b || b.disabled) return;
                state.size = b.dataset.size;
                $$('.pd-size').forEach(x => x.setAttribute('aria-checked', String(x === b)));
                $('#pdSizeError').textContent = '';
                updateBuyState();
            });
            info.addEventListener('click', e => {
                const sw = e.target.closest('.pd-swatch'); if (!sw) return;
                state.color = sw.dataset.color;
                $$('.pd-swatch').forEach(x => x.setAttribute('aria-checked', String(x === sw)));
                $('#pdColorName').textContent = state.color;
                $('#pdSpecColor').textContent = state.color;
                renderGallery();
            });
            $('#pdQtyMinus').addEventListener('click', () => { state.qty--; updateBuyState(); });
            $('#pdQtyPlus').addEventListener('click', () => { state.qty++; updateBuyState(); });

            /* ---------- Cart actions ---------- */
            function validate() {
                if (cat.needsSize(p) && !state.size) {
                    $('#pdSizeError').textContent = 'Please select a size to continue.';
                    const field = $('#pdSizeField');
                    field.scrollIntoView({ behavior: smooth, block: 'center' });
                    field.classList.remove('pd-shake'); void field.offsetWidth; field.classList.add('pd-shake');
                    return false;
                }
                return true;
            }
            function addToCart() {
                if (!validate()) return false;
                Sutra.cart.addItem({ id: p.id, size: state.size, color: state.color, qty: state.qty });
                return true;
            }
            function flash(btn, label) {
                const original = btn.textContent;
                btn.textContent = label; btn.classList.add('is-added');
                setTimeout(() => { btn.textContent = original; btn.classList.remove('is-added'); }, 1500);
            }
            function onAdd(btn) {
                if (!addToCart()) return;
                flash(btn, 'Added \u2713');
                Sutra.toast(`${p.name} (${state.color}${cat.needsSize(p) ? ', ' + state.size : ''}) added to your cart`, { actionText: 'View Cart', href: 'cart.html' });
            }
            $('#pdAdd').addEventListener('click', e => onAdd(e.currentTarget));
            $('#pdStickyAdd').addEventListener('click', e => onAdd(e.currentTarget));
            $('#pdBuyNow').addEventListener('click', () => { if (addToCart()) window.location.href = 'checkout.html'; });

            /* ---------- Wishlist ---------- */
            const wishBtn = $('#pdWish');
            function syncWish() {
                const on = Sutra.wishlist.has(p.id);
                wishBtn.setAttribute('aria-pressed', String(on));
                wishBtn.setAttribute('aria-label', on ? 'Remove from wishlist' : 'Save to wishlist');
            }
            wishBtn.addEventListener('click', () => {
                const added = Sutra.wishlist.toggle(p.id);
                syncWish();
                Sutra.toast(added ? `${p.name} saved to your wishlist` : 'Removed from your wishlist', added ? { actionText: 'View Wishlist', href: 'wishlist.html' } : {});
            });
            syncWish();

            /* ---------- Share ---------- */
            $('#pdShare').addEventListener('click', async () => {
                const url = window.location.href;
                const data = { title: p.name, text: `${p.name} \u2014 Sutra Textiles India`, url };
                try {
                    if (navigator.share) { await navigator.share(data); return; }
                    await navigator.clipboard.writeText(url);
                    Sutra.toast('Link copied to clipboard');
                } catch (err) {
                    if (err && err.name !== 'AbortError') Sutra.toast('Copy this page link from your address bar');
                }
            });

            /* ---------- Delivery estimate (mock — replace with API) ---------- */
            const TRANSIT = { '1': [2, 4], '2': [2, 4], '3': [1, 2], '4': [2, 4], '5': [3, 5], '6': [3, 5], '7': [3, 6], '8': [3, 5] };
            const fmtDay = (d) => new Intl.DateTimeFormat('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }).format(d);
            function checkPin(pin) {
                const res = $('#pdPinResult');
                if (!/^[1-9][0-9]{5}$/.test(pin)) {
                    res.className = 'pd-pin-result is-err'; res.textContent = 'Please enter a valid 6-digit pincode.'; return;
                }
                const t = TRANSIT[pin[0]];
                if (!t) { res.className = 'pd-pin-result is-err'; res.textContent = 'We\u2019ll confirm delivery for this pincode \u2014 please contact us.'; return; }
                const from = new Date(), to = new Date();
                from.setDate(from.getDate() + p.dispatchDays[0] + t[0]);
                to.setDate(to.getDate() + p.dispatchDays[1] + t[1]);
                res.className = 'pd-pin-result is-ok';
                res.innerHTML = `Delivery to <strong>${esc(pin)}</strong> by <strong>${fmtDay(from)} \u2013 ${fmtDay(to)}</strong>${p.stock === 'made-to-order' ? ' (made to order)' : ''}.`;
                Sutra.store.write('sutra_pin_v1', pin);
            }
            $('#pdPinForm').addEventListener('submit', e => { e.preventDefault(); checkPin($('#pdPin').value.trim()); });
            $('#pdPin').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });
            const savedPin = Sutra.store.read('sutra_pin_v1', '');
            if (savedPin) { $('#pdPin').value = savedPin; checkPin(savedPin); }

            /* ---------- Size guide ---------- */
            const dlg = $('#sizeDialog');
            const MEASURES = { XS: [32, 26, 35], S: [34, 28, 37], M: [36, 30, 39], L: [38, 32, 41], XL: [40, 34, 43], XXL: [42, 36, 45] };
            let unit = 'in';

            function renderSizeGuide() {
                let body;
                if (p.category === 'sarees') {
                    body = `
        <p>Sarees are one size and fit most heights and builds.</p>
        <table class="sg-table"><tbody>
          <tr><th scope="row">Saree length</th><td>5.5 m</td></tr>
          <tr><th scope="row">Blouse piece</th><td>0.8 m (unstitched)</td></tr>
        </tbody></table>
        <div class="sg-tips"><h3>STITCHING THE BLOUSE</h3><p>Have your tailor measure bust, waist and sleeve length, and allow a little extra at the seams so the blouse can be adjusted later.</p></div>`;
                } else {
                    const f = unit === 'in' ? 1 : 2.54;
                    const fmt = (n) => unit === 'in' ? n : Math.round(n * f);
                    body = `
        <div class="sg-toggle" role="group" aria-label="Units">
          <button type="button" data-unit="in" aria-pressed="${unit === 'in'}">Inches</button>
          <button type="button" data-unit="cm" aria-pressed="${unit === 'cm'}">Centimetres</button>
        </div>
        <table class="sg-table">
          <thead><tr><th>Size</th><th>Bust</th><th>Waist</th><th>Hip</th></tr></thead>
          <tbody>${p.sizes.map(s => { const m = MEASURES[s.label] || ['-', '-', '-']; return `<tr><th scope="row">${esc(s.label)}</th><td>${fmt(m[0])}</td><td>${fmt(m[1])}</td><td>${fmt(m[2])}</td></tr>`; }).join('')}</tbody>
        </table>
        <p style="font-size:.8rem;color:var(--olive);margin-top:.6rem">Body measurements, not garment measurements.</p>
        <div class="sg-tips"><h3>HOW TO MEASURE</h3>
          <ul class="pd-list" style="display:grid;gap:.4rem">
            <li><strong style="font-weight:500">Bust:</strong> around the fullest part of your chest.</li>
            <li><strong style="font-weight:500">Waist:</strong> around the narrowest part of your waist.</li>
            <li><strong style="font-weight:500">Hip:</strong> around the fullest part of your hips.</li>
          </ul>
          <p style="margin-top:.8rem">Between sizes? Choose the larger size for a relaxed fit, or <a class="pd-link" href="contact.html">ask us</a>.</p>
        </div>`;
                }
                $('#sgContent').innerHTML = `
      <div class="sg-head"><h2 id="sgTitle">${sizeGuideLabel()}</h2><button type="button" class="sg-close" id="sgClose" aria-label="Close size guide">&times;</button></div>${body}`;
            }
            $('#pdSizeGuide').addEventListener('click', () => {
                renderSizeGuide();
                typeof dlg.showModal === 'function' ? dlg.showModal() : dlg.setAttribute('open', '');
            });
            dlg.addEventListener('click', e => {
                if (e.target === dlg || e.target.closest('#sgClose')) dlg.close();
                const u = e.target.closest('[data-unit]');
                if (u) { unit = u.dataset.unit; renderSizeGuide(); }
            });

            /* ===========================================================
               CARDS (related + recently viewed) — same markup as shop
               =========================================================== */
            const TINT_STROKE = { 1: '#1C3329', 2: '#E3CB8E', 3: '#1C3329', 4: '#F5F0E6' };
            function cardHTML(o) {
                return `
      <div class="product-card">
        <a class="pd-card-link" href="product.html?id=${o.id}" aria-label="${esc(o.name)}">
          <div class="product-art tint-${o.tint}">
            ${o.tag ? `<span class="product-tag">${esc(o.tag)}</span>` : ''}
            <svg viewBox="0 0 80 100" fill="none" stroke="${TINT_STROKE[o.tint]}"><path d="M40 10c-10 6-16 16-16 28 0 14 7 25 16 31 9-6 16-17 16-31 0-12-6-22-16-28Z" stroke-width="1"/></svg>
          </div>
          <div class="product-info">
            <div><h3>${esc(o.name)}</h3><span class="region">${esc(cat.regionLabel(o.region))}</span></div>
            <span class="product-price">${money(o.price)}</span>
          </div>
        </a>
        <button type="button" class="add-cart" data-id="${o.id}">${cat.needsSize(o) ? 'Select Size' : 'Add to Cart'}</button>
      </div>`;
            }
            $('#pdRelated').innerHTML = cat.related(p, 4).map(cardHTML).join('');

            const RECENT_KEY = 'sutra_recent_v1';
            const recent = Sutra.store.read(RECENT_KEY, []).filter(id => id !== p.id);
            const recentItems = recent.map(id => cat.byId(id)).filter(Boolean).slice(0, 4);
            if (recentItems.length) {
                $('#pdRecent').innerHTML = recentItems.map(cardHTML).join('');
                $('#pdRecentSection').hidden = false;
            }
            Sutra.store.write(RECENT_KEY, [p.id].concat(recent).slice(0, 8));

            /* ===========================================================
               STICKY BAR (appears when the main buy box scrolls away)
               =========================================================== */
            $('#pdStickyName').textContent = p.name;
            const sticky = $('#pdSticky');
            const visible = { buy: true, footer: false };
            function syncSticky() {
                const show = !visible.buy && !visible.footer;
                sticky.classList.toggle('is-visible', show);
                sticky.setAttribute('aria-hidden', String(!show));
                $('#pdStickyAdd').tabIndex = show ? 0 : -1;
            }
            if ('IntersectionObserver' in window) {
                new IntersectionObserver(([en]) => { visible.buy = en.isIntersecting || en.boundingClientRect.top > 0; syncSticky(); }).observe($('#pdBuy'));
                const footerEl = $('#footer');
                new IntersectionObserver(([en]) => { visible.footer = en.isIntersecting; syncSticky(); }).observe(footerEl);
            }

            /* ===========================================================
               STRUCTURED DATA (SEO)
               =========================================================== */
            function updateSchema() {
                const { avg, n } = ratingSummary();
                const data = {
                    '@context': 'https://schema.org', '@type': 'Product',
                    name: p.name, description: p.description, sku: p.sku,
                    category: cat.categoryLabel(p.category),
                    brand: { '@type': 'Brand', name: 'Sutra Textiles India' },
                    color: p.colors.map(c => c.name).join(', '),
                    offers: {
                        '@type': 'Offer', priceCurrency: 'INR', price: p.price, url: window.location.href,
                        availability: p.stock === 'in-stock' ? 'https://schema.org/InStock' : 'https://schema.org/PreOrder'
                    },
                    aggregateRating: { '@type': 'AggregateRating', ratingValue: avg.toFixed(1), reviewCount: n }
                };
                let tag = document.getElementById('pdSchema');
                if (!tag) { tag = document.createElement('script'); tag.type = 'application/ld+json'; tag.id = 'pdSchema'; document.head.appendChild(tag); }
                tag.textContent = JSON.stringify(data);
            }

            /* ---------- Init ---------- */
            renderGallery();
            updateBuyState();
            renderRatingRow();
            renderReviews();
        })();
    </script>
