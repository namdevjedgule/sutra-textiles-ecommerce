<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — Sutra Textiles India</title>
    <meta name="description" id="metaDesc"
        content="Traditional ethnic wear from every state, made in-house in Bhilwara, Rajasthan — Sutra Textiles India.">
 <link rel="icon" type="image/x-icon" th:href="@{/favicon_io/favicon.ico}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Work+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        [hidden] {
            display: none !important;
        }

        /* ---------- Layout ---------- */
        .pd-main {
            padding-block: 0 clamp(2.5rem, 5vw, 4rem);
        }

        .pd-breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .45rem;
            font-size: .8rem;
            color: var(--olive);
            padding-block: 1.1rem 1.6rem;
        }

        .pd-breadcrumb a:hover {
            color: var(--green);
        }

        .pd-breadcrumb [aria-current] {
            color: var(--charcoal);
        }

        .pd-breadcrumb .sep {
            opacity: .5;
        }

        .pd-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
            gap: clamp(1.75rem, 4vw, 4rem);
            align-items: start;
        }

        /* ---------- Gallery ---------- */
        .pd-gallery {
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr);
            gap: 1rem;
            position: sticky;
            top: calc(var(--nav-h, 100px) + 1rem);
        }

        .pd-thumbs {
            display: flex;
            flex-direction: column;
            gap: .7rem;
        }

        .pd-thumb {
            width: 78px;
            aspect-ratio: 4 / 5;
            border: 1px solid var(--grey);
            border-radius: 50% 50% 3px 3px / 26% 26% 3px 3px;
            overflow: hidden;
            padding: 0;
            background: var(--ivory-soft);
            opacity: .72;
            transition: opacity .2s var(--ease), border-color .2s var(--ease);
        }

        .pd-thumb:hover {
            opacity: 1;
        }

        .pd-thumb.is-active {
            opacity: 1;
            border-color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold);
        }

        .pd-thumb svg,
        .pd-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pd-stage {
            min-width: 0;
        }

        .pd-frame {
            position: relative;
            width: min(100%, max(320px, calc((100vh - var(--nav-h, 100px) - 5rem) * .8)));
            aspect-ratio: 4 / 5;
            margin-inline: auto;
            border: 1px solid rgba(201, 162, 75, .65);
            border-radius: 50% 50% 8px 8px / 28% 28% 8px 8px;
            padding: 12px;
            cursor: zoom-in;
            outline-offset: 4px;
        }

        .pd-slide {
            position: absolute;
            inset: 12px;
            border-radius: 50% 50% 4px 4px / 27% 27% 4px 4px;
            overflow: hidden;
            background: var(--ivory-soft);
        }

        .pd-slide>svg,
        .pd-slide>img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .25s var(--ease);
        }

        .pd-slide.pd-fade>* {
            animation: pd-fade .4s var(--ease);
        }

        @keyframes pd-fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .pd-frame.is-zooming .pd-slide>* {
            transform: scale(1.9);
            transform-origin: var(--zx, 50%) var(--zy, 50%);
        }

        .pd-tag {
            position: absolute;
            top: 2.2rem;
            left: 1.4rem;
            z-index: 2;
            background: var(--terracotta);
            color: var(--ivory);
            font-size: .7rem;
            letter-spacing: .08em;
            padding: .3rem .65rem;
            border-radius: var(--radius);
        }

        .pd-icon-btn,
        .pd-arrow {
            position: absolute;
            z-index: 2;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(251, 248, 242, .92);
            color: var(--green);
            border: 1px solid rgba(20, 38, 32, .12);
            transition: background .2s var(--ease), opacity .2s var(--ease);
        }

        .pd-icon-btn:hover,
        .pd-arrow:hover {
            background: var(--ivory-soft);
        }

        .pd-icon-btn svg,
        .pd-arrow svg {
            width: 18px;
            height: 18px;
        }

        .pd-expand {
            top: 2rem;
            right: 1.2rem;
        }

        .pd-arrow {
            top: 50%;
            transform: translateY(-50%);
        }

        .pd-prev {
            left: 1.2rem;
        }

        .pd-next {
            right: 1.2rem;
        }

        @media (hover: hover) and (pointer: fine) {
            .pd-arrow {
                opacity: 0;
            }

            .pd-frame:hover .pd-arrow,
            .pd-frame:focus-within .pd-arrow {
                opacity: 1;
            }
        }

        .pd-counter {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            background: rgba(20, 38, 32, .72);
            color: var(--ivory);
            font-size: .72rem;
            letter-spacing: .08em;
            padding: .25rem .7rem;
            border-radius: 999px;
        }

        .pd-view-label {
            text-align: center;
            font-size: .8rem;
            color: var(--olive);
            margin: .9rem auto 0;
        }

        /* ---------- Info column ---------- */
        .pd-info {
            min-width: 0;
        }

        .pd-eyebrow {
            display: flex;
            align-items: center;
            gap: .7rem;
            font-size: .76rem;
            letter-spacing: .14em;
            color: var(--olive);
        }

        .pd-eyebrow i {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
        }

        .pd-eyebrow a:hover {
            color: var(--green);
        }

        .pd-title {
            font-size: clamp(1.9rem, 3.2vw, 2.7rem);
            margin: .55rem 0 .7rem;
        }

        .pd-rating {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            font-size: .86rem;
            color: var(--olive);
        }

        .pd-rating:hover .pd-rating-text {
            color: var(--green);
            text-decoration: underline;
        }

        .stars {
            --pct: 0%;
            display: inline-block;
            font-size: 1.05rem;
            letter-spacing: 2px;
            line-height: 1;
            background: linear-gradient(90deg, var(--gold) var(--pct), var(--grey) var(--pct));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .pd-price-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: .8rem;
            margin-top: 1.2rem;
        }

        .pd-price {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3vw, 2.3rem);
            color: var(--green);
            font-weight: 600;
        }

        .pd-mrp {
            color: var(--olive);
            font-size: 1rem;
            opacity: .85;
        }

        .pd-off {
            font-size: .74rem;
            letter-spacing: .06em;
            color: var(--ivory);
            background: var(--olive);
            padding: .22rem .55rem;
            border-radius: var(--radius);
        }

        .pd-tax {
            font-size: .8rem;
            color: var(--olive);
            margin-top: .35rem;
        }

        .pd-blurb {
            margin-top: 1.1rem;
            color: #3a3f37;
        }

        .pd-divider {
            border: none;
            height: 1px;
            background: var(--grey);
            margin: 1.6rem 0;
            position: relative;
            overflow: visible;
        }

        .pd-divider::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 7px;
            background: var(--ivory);
            border: 1px solid var(--gold);
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .pd-field {
            margin-top: 1.4rem;
        }

        .pd-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .86rem;
            margin-bottom: .7rem;
            color: var(--olive);
        }

        .pd-label strong {
            color: var(--charcoal);
            font-weight: 500;
        }

        .pd-link {
            font-size: .82rem;
            color: var(--green);
            border-bottom: 1px solid var(--gold);
            padding-bottom: 1px;
        }

        .pd-link:hover {
            color: var(--green-deep);
        }

        .pd-swatches {
            display: flex;
            flex-wrap: wrap;
            gap: .8rem;
        }

        .pd-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--sw);
            border: 1px solid rgba(0, 0, 0, .15);
            transition: transform .2s var(--ease);
        }

        .pd-swatch:hover {
            transform: scale(1.08);
        }

        .pd-swatch[aria-checked="true"] {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .pd-sizes {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
        }

        .pd-size {
            min-width: 56px;
            height: 46px;
            padding: 0 1rem;
            border: 1px solid var(--grey);
            background: var(--ivory-soft);
            color: var(--charcoal);
            font-size: .9rem;
            border-radius: var(--radius);
            transition: border-color .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
        }

        .pd-size:hover:not(:disabled) {
            border-color: var(--green);
        }

        .pd-size[aria-checked="true"] {
            background: var(--green);
            border-color: var(--green);
            color: var(--ivory);
        }

        .pd-size:disabled {
            cursor: not-allowed;
            color: #9a978c;
            background: linear-gradient(to top right, transparent calc(50% - .5px), #b9b3a3 50%, transparent calc(50% + .5px)), var(--ivory-soft);
        }

        .pd-error {
            color: var(--terracotta);
            font-size: .82rem;
            margin-top: .6rem;
            min-height: 0;
        }

        .pd-shake {
            animation: pd-shake .4s var(--ease);
        }

        @keyframes pd-shake {

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        .pd-lowstock {
            color: var(--terracotta);
            font-size: .82rem;
            margin-top: .6rem;
        }

        .pd-avail {
            display: flex;
            align-items: center;
            gap: .55rem;
            margin-top: 1.4rem;
            font-size: .88rem;
            color: var(--green);
        }

        .pd-avail::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--olive);
            flex-shrink: 0;
        }

        .pd-avail.is-mto::before {
            background: var(--gold);
        }

        /* ---------- Buy box ---------- */
        .pd-buy {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: .8rem;
            margin-top: 1.4rem;
            align-items: stretch;
        }

        .pd-qty {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--grey);
            background: var(--ivory-soft);
            border-radius: var(--radius);
        }

        .pd-qty button {
            width: 42px;
            height: 100%;
            min-height: 52px;
            font-size: 1.2rem;
            color: var(--green);
        }

        .pd-qty button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .pd-qty output {
            min-width: 30px;
            text-align: center;
            font-weight: 500;
        }

        .pd-btn-add,
        .pd-btn-now {
            min-height: 52px;
            padding: 0 1.5rem;
            font-size: .92rem;
            letter-spacing: .05em;
            border-radius: var(--radius);
            transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
        }

        .pd-btn-add {
            background: var(--green);
            color: var(--ivory);
        }

        .pd-btn-add:hover {
            background: var(--green-deep);
        }

        .pd-btn-add.is-added {
            background: var(--olive);
        }

        .pd-btn-now {
            grid-column: 1 / -1;
            background: var(--gold);
            color: var(--green-deep);
            font-weight: 500;
        }

        .pd-btn-now:hover {
            background: var(--gold-light);
        }

        .pd-wish {
            width: 52px;
            border: 1px solid var(--grey);
            background: var(--ivory-soft);
            color: var(--green);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .2s var(--ease), color .2s var(--ease);
        }

        .pd-wish svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            transition: fill .2s var(--ease);
        }

        .pd-wish:hover {
            border-color: var(--terracotta);
            color: var(--terracotta);
        }

        .pd-wish[aria-pressed="true"] {
            color: var(--terracotta);
            border-color: var(--terracotta);
        }

        .pd-wish[aria-pressed="true"] svg {
            fill: var(--terracotta);
        }

        .pd-secondary {
            display: flex;
            gap: 1.4rem;
            margin-top: 1rem;
            font-size: .84rem;
        }

        .pd-secondary button {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            color: var(--olive);
        }

        .pd-secondary button:hover {
            color: var(--green);
        }

        .pd-secondary svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
        }

        /* ---------- Delivery ---------- */
        .pd-delivery {
            margin-top: 1.6rem;
            padding: 1.2rem;
            border: 1px dashed #c3b99e;
            border-radius: var(--radius);
            background: var(--ivory-soft);
        }

        .pd-delivery h3 {
            font-family: var(--font-body);
            font-size: .86rem;
            letter-spacing: .06em;
            margin-bottom: .8rem;
            font-weight: 500;
        }

        .pd-pin {
            display: flex;
            gap: .6rem;
        }

        .pd-pin input {
            flex: 1;
            min-width: 0;
            padding: .75rem 1rem;
            border: 1px solid var(--grey);
            background: var(--ivory);
            border-radius: var(--radius);
            color: var(--charcoal);
        }

        .pd-pin button {
            padding: 0 1.3rem;
            border: 1px solid var(--green);
            color: var(--green);
            border-radius: var(--radius);
            font-size: .86rem;
        }

        .pd-pin button:hover {
            background: var(--green);
            color: var(--ivory);
        }

        .pd-pin-result {
            margin-top: .8rem;
            font-size: .86rem;
        }

        .pd-pin-result.is-ok {
            color: var(--green);
        }

        .pd-pin-result.is-err {
            color: var(--terracotta);
        }

        .pd-trust {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .8rem;
            margin-top: 1.4rem;
        }

        .pd-trust li {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: .5rem;
            font-size: .76rem;
            color: var(--olive);
            line-height: 1.35;
        }

        .pd-trust svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: var(--green);
            stroke-width: 1.4;
        }

        /* ---------- Accordions ---------- */
        .pd-acc {
            margin-top: 1.8rem;
            border-top: 1px solid var(--grey);
        }

        .pd-acc details {
            border-bottom: 1px solid var(--grey);
        }

        .pd-acc summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 0;
            font-family: var(--font-display);
            font-size: 1.12rem;
            color: var(--green);
        }

        .pd-acc summary::-webkit-details-marker {
            display: none;
        }

        .pd-acc summary::after {
            content: "+";
            font-family: var(--font-body);
            font-size: 1.3rem;
            color: var(--gold);
            transition: transform .25s var(--ease);
        }

        .pd-acc details[open] summary::after {
            transform: rotate(45deg);
        }

        .pd-acc .pd-acc-body {
            padding-bottom: 1.3rem;
            font-size: .92rem;
            color: #3a3f37;
        }

        .pd-acc ul.pd-list {
            display: grid;
            gap: .45rem;
            margin-top: .8rem;
        }

        .pd-acc ul.pd-list li {
            position: relative;
            padding-left: 1.1rem;
        }

        .pd-acc ul.pd-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: .6em;
            width: 5px;
            height: 5px;
            background: var(--gold);
            transform: rotate(45deg);
        }

        .pd-spec {
            width: 100%;
            border-collapse: collapse;
        }

        .pd-spec th,
        .pd-spec td {
            text-align: left;
            padding: .55rem 0;
            border-bottom: 1px dashed #d4cbb4;
            font-weight: 400;
            vertical-align: top;
        }

        .pd-spec th {
            color: var(--olive);
            width: 38%;
            padding-right: 1rem;
        }

        .pd-spec tr:last-child th,
        .pd-spec tr:last-child td {
            border-bottom: none;
        }

        /* ---------- Reviews ---------- */
        .pd-reviews {
            background: var(--ivory-soft);
            border-block: 1px solid var(--grey);
        }

        .rv-head {
            display: grid;
            grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
            gap: clamp(1.5rem, 5vw, 4rem);
            align-items: center;
        }

        .rv-score {
            font-family: var(--font-display);
            font-size: 4rem;
            line-height: 1;
            color: var(--green);
            font-weight: 600;
        }

        .rv-score small {
            font-size: 1.2rem;
            color: var(--olive);
            font-weight: 400;
        }

        .rv-meta {
            font-size: .88rem;
            color: var(--olive);
            margin: .5rem 0 1.2rem;
        }

        .rv-bars {
            display: grid;
            gap: .5rem;
        }

        .rv-bar {
            display: grid;
            grid-template-columns: 34px 1fr 30px;
            align-items: center;
            gap: .8rem;
            font-size: .82rem;
            color: var(--olive);
            text-align: left;
            padding: .15rem .3rem;
            border-radius: var(--radius);
        }

        .rv-bar:hover,
        .rv-bar.is-active {
            background: rgba(201, 162, 75, .12);
        }

        .rv-track {
            height: 6px;
            background: var(--grey);
            border-radius: 3px;
            overflow: hidden;
        }

        .rv-fill {
            display: block;
            height: 100%;
            background: var(--gold);
            border-radius: 3px;
        }

        .rv-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 2.4rem 0 .5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--grey);
        }

        .rv-toolbar .left {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: .86rem;
            color: var(--olive);
        }

        .rv-clear {
            color: var(--terracotta);
            border-bottom: 1px solid transparent;
        }

        .rv-clear:hover {
            border-color: var(--terracotta);
        }

        .rv-sort {
            border: 1px solid var(--grey);
            background: var(--ivory);
            padding: .5rem .8rem;
            border-radius: var(--radius);
            font-size: .85rem;
            color: var(--charcoal);
        }

        .rv-item {
            display: grid;
            grid-template-columns: 48px 1fr;
            gap: 1rem;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--grey);
        }

        .rv-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--green);
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.2rem;
        }

        .rv-who {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .3rem .8rem;
            font-size: .86rem;
        }

        .rv-who strong {
            font-weight: 500;
            color: var(--charcoal);
        }

        .rv-who span {
            color: var(--olive);
        }

        .rv-badge {
            font-size: .68rem;
            letter-spacing: .06em;
            padding: .15rem .5rem;
            border: 1px solid var(--olive);
            color: var(--olive);
            border-radius: 999px;
        }

        .rv-badge.mine {
            border-color: var(--gold);
            color: #8a6a1f;
        }

        .rv-line {
            display: flex;
            align-items: center;
            gap: .7rem;
            margin: .35rem 0;
            font-size: .82rem;
            color: var(--olive);
        }

        .rv-title {
            font-family: var(--font-display);
            font-size: 1.12rem;
            color: var(--green);
            margin-bottom: .3rem;
        }

        .rv-body {
            font-size: .93rem;
            color: #3a3f37;
            max-width: 70ch;
        }

        .rv-actions {
            display: flex;
            gap: 1.2rem;
            margin-top: .8rem;
            font-size: .82rem;
        }

        .rv-actions button {
            color: var(--olive);
            display: inline-flex;
            gap: .4rem;
            align-items: center;
        }

        .rv-actions button:hover,
        .rv-actions button[aria-pressed="true"] {
            color: var(--green);
        }

        .rv-actions button[aria-pressed="true"] {
            font-weight: 500;
        }

        .rv-more {
            text-align: center;
            margin-top: 2rem;
        }

        .rv-form-wrap {
            margin-top: 2rem;
            padding: clamp(1.3rem, 3vw, 2rem);
            background: var(--ivory);
            border: 1px solid var(--grey);
            border-radius: var(--radius);
        }

        .rv-form-wrap h3 {
            margin-bottom: 1rem;
        }

        .rv-form {
            display: grid;
            gap: 1.1rem;
            grid-template-columns: 1fr 1fr;
        }

        .rv-form .full {
            grid-column: 1 / -1;
        }

        .rv-form label.lbl {
            display: block;
            font-size: .84rem;
            color: var(--olive);
            margin-bottom: .4rem;
        }

        .rv-form input[type="text"],
        .rv-form textarea {
            width: 100%;
            padding: .75rem 1rem;
            border: 1px solid var(--grey);
            background: var(--ivory-soft);
            border-radius: var(--radius);
            color: var(--charcoal);
            font: inherit;
        }

        .rv-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .rv-form .field-error {
            color: var(--terracotta);
            font-size: .8rem;
            margin-top: .35rem;
            min-height: 1em;
        }

        .rv-count {
            font-size: .76rem;
            color: var(--olive);
            text-align: right;
            margin-top: .25rem;
        }

        .star-input {
            display: inline-flex;
            flex-direction: row-reverse;
            gap: .15rem;
        }

        .star-input input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        .star-input label {
            font-size: 1.9rem;
            color: var(--grey);
            cursor: pointer;
            line-height: 1;
            transition: color .15s var(--ease);
        }

        .star-input input:checked~label,
        .star-input label:hover,
        .star-input label:hover~label {
            color: var(--gold);
        }

        .star-input input:focus-visible+label {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .rv-form-actions {
            display: flex;
            gap: .8rem;
        }

        /* ---------- Related / recent ---------- */
        .pd-related {
            background: var(--ivory);
        }

        .pd-recent {
            background: var(--ivory-soft);
            border-top: 1px solid var(--grey);
        }

        .pd-card-link {
            display: block;
        }

        .pd-card-link:hover .product-art {
            transform: translateY(-3px);
        }

        .product-art {
            transition: transform .35s var(--ease);
        }

        /* ---------- Sticky buy bar ---------- */
        .pd-sticky {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 900;
            background: var(--ivory-soft);
            border-top: 1px solid var(--grey);
            box-shadow: 0 -8px 24px rgba(20, 38, 32, .08);
            transform: translateY(110%);
            transition: transform .3s var(--ease);
        }

        .pd-sticky.is-visible {
            transform: none;
        }

        .pd-sticky-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-block: .8rem;
        }

        .pd-sticky-name {
            font-family: var(--font-display);
            color: var(--green);
            font-size: 1.05rem;
            line-height: 1.2;
        }

        .pd-sticky-price {
            font-size: .86rem;
            color: var(--olive);
        }

        .pd-sticky .pd-btn-add {
            padding-inline: 2rem;
            white-space: nowrap;
        }

        /* ---------- Lightbox ---------- */
        .lb {
            position: fixed;
            inset: 0;
            z-index: 2100;
            background: rgba(14, 26, 21, .96);
            display: grid;
            grid-template-rows: auto 1fr auto;
            color: var(--ivory);
        }

        .lb-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem clamp(1rem, 3vw, 2rem);
            font-size: .85rem;
            letter-spacing: .08em;
        }

        .lb-top .actions {
            display: flex;
            gap: .6rem;
        }

        .lb-btn {
            min-width: 42px;
            height: 42px;
            padding: 0 1rem;
            border: 1px solid rgba(245, 240, 230, .35);
            border-radius: 999px;
            color: var(--ivory);
            font-size: .82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .lb-btn:hover {
            background: rgba(245, 240, 230, .1);
        }

        .lb-stage {
            position: relative;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(3.5rem, 8vw, 6rem);
            overflow: hidden;
        }

        .lb-slide {
            height: 100%;
            max-height: 100%;
            aspect-ratio: 4 / 5;
            max-width: 100%;
            border-radius: 50% 50% 6px 6px / 22% 22% 6px 6px;
            overflow: hidden;
            cursor: zoom-in;
        }

        .lb-slide>svg,
        .lb-slide>img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .25s var(--ease);
        }

        .lb-stage.is-zoomed .lb-slide {
            cursor: zoom-out;
        }

        .lb-stage.is-zoomed .lb-slide>* {
            transform: scale(2);
            transform-origin: var(--zx, 50%) var(--zy, 50%);
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(245, 240, 230, .35);
            color: var(--ivory);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lb-nav:hover {
            background: rgba(245, 240, 230, .1);
        }

        .lb-nav svg {
            width: 20px;
            height: 20px;
        }

        .lb-prev {
            left: clamp(.6rem, 2vw, 1.5rem);
        }

        .lb-next {
            right: clamp(.6rem, 2vw, 1.5rem);
        }

        .lb-thumbs {
            display: flex;
            justify-content: center;
            gap: .7rem;
            padding: 1rem;
        }

        .lb-thumbs .pd-thumb {
            width: 60px;
        }

        /* ---------- Size guide dialog ---------- */
        .pd-dialog {
            border: none;
            border-radius: var(--radius);
            background: var(--ivory-soft);
            color: var(--charcoal);
            width: min(640px, calc(100vw - 1.5rem));
            max-height: calc(100vh - 2rem);
            padding: 0;
            margin: auto;
        }

        .pd-dialog::backdrop {
            background: rgba(20, 38, 32, .55);
        }

        .sg-inner {
            padding: clamp(1.3rem, 3vw, 2rem);
        }

        .sg-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .sg-close {
            font-size: 1.6rem;
            line-height: 1;
            color: var(--green);
            width: 36px;
            height: 36px;
        }

        .sg-toggle {
            display: inline-flex;
            border: 1px solid var(--grey);
            border-radius: 999px;
            margin: .6rem 0 1rem;
            overflow: hidden;
        }

        .sg-toggle button {
            padding: .4rem 1.1rem;
            font-size: .82rem;
            color: var(--olive);
        }

        .sg-toggle button[aria-pressed="true"] {
            background: var(--green);
            color: var(--ivory);
        }

        .sg-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem;
        }

        .sg-table th,
        .sg-table td {
            padding: .65rem .5rem;
            text-align: center;
            border-bottom: 1px solid var(--grey);
        }

        .sg-table th {
            font-weight: 500;
            color: var(--green);
            background: var(--ivory);
        }

        .sg-table tbody th {
            background: transparent;
        }

        .sg-tips {
            margin-top: 1.2rem;
            font-size: .88rem;
            color: #3a3f37;
        }

        .sg-tips h3 {
            font-family: var(--font-body);
            font-size: .86rem;
            letter-spacing: .06em;
            margin-bottom: .5rem;
        }

        /* ---------- Not found ---------- */
        .pd-notfound {
            text-align: center;
            padding: clamp(3rem, 8vw, 6rem) 1rem;
        }

        .pd-notfound p {
            margin: .8rem auto 1.6rem;
            color: var(--olive);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 920px) {
            .pd-grid {
                grid-template-columns: 1fr;
            }

            .pd-gallery {
                position: static;
                grid-template-columns: 1fr;
            }

            .pd-thumbs {
                order: 2;
                flex-direction: row;
                justify-content: center;
                overflow-x: auto;
            }

            .pd-thumb {
                width: 64px;
                flex-shrink: 0;
            }

            .pd-frame {
                width: min(100%, 480px);
            }

            .rv-head {
                grid-template-columns: 1fr;
            }

            .pd-arrow {
                opacity: 1;
            }
        }

        @media (max-width: 560px) {
            .pd-buy {
                grid-template-columns: auto 1fr auto;
            }

            .pd-trust {
                gap: .4rem;
            }

            .rv-form {
                grid-template-columns: 1fr;
            }

            .pd-sticky-name {
                font-size: .95rem;
            }

            .pd-sticky .pd-btn-add {
                padding-inline: 1.2rem;
            }
        }
    </style>
</head>

    <!-- ===================== PAGE-SPECIFIC JS (Product Detail) ===================== -->
    <script>
        (function () {
            'use strict';

            const cat = Sutra.catalog;
            const params = new URLSearchParams(window.location.search);
            const p = cat.byId(params.get('id'));
            const $ = (sel, root = document) => root.querySelector(sel);
            const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const smooth = reduceMotion ? 'auto' : 'smooth';
            const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const money = cat.money;
            const FREE_SHIP = 2999;

            /* ---------- Not found ---------- */
            if (!p) {
                $('#pdGrid').hidden = true;
                $('#pdNotFound').hidden = false;
                $$('[data-pd-only]').forEach(el => { el.hidden = true; });
                document.title = 'Product not found — Sutra Textiles India';
                return;
            }

            /* ---------- State ---------- */
            const state = {
                color: cat.defaultColor(p),
                size: cat.needsSize(p) ? null : p.sizes[0].label,
                qty: 1,
                view: 0
            };
            let slides = [];

            /* ---------- Page meta ---------- */
            document.title = `${p.name} — Sutra Textiles India`;
            $('#metaDesc').setAttribute('content', `${p.name} \u2014 ${p.description}`.slice(0, 300));
            $('#pdBreadcrumb').innerHTML = `
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="shop.html">Shop</a><span class="sep">/</span>
    <a href="shop.html?cat=${p.category}">${esc(cat.categoryLabel(p.category))}</a><span class="sep">/</span>
    <span aria-current="page">${esc(p.name)}</span>`;

            const hexToRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
            const toHex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
            const mix = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return toHex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t); };
            const luminance = (hex) => {
                const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
                return .2126 * r + .7152 * g + .0722 * b;
            };

            const VIEW_LABELS = {
                sarees: ['Full drape', 'Pallu', 'Fabric detail', 'Motif'],
                default: ['Front view', 'Back view', 'Fabric detail', 'Motif']
            };

            let uid = 0;
            function artSvg(view, hex, category) {
                const id = 'art' + (++uid);
                const dark = luminance(hex) < .32;
                const bgA = mix(hex, '#ffffff', dark ? .14 : .38);
                const bgB = mix(hex, '#000000', dark ? .38 : .16);
                const line = dark ? '#E3CB8E' : '#1C3329';
                const soft = dark ? 'rgba(227,203,142,.13)' : 'rgba(28,51,41,.09)';
                const g = `fill="${soft}" stroke="${line}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
                let body = '';

                if (view === 'detail') {
                    body = `
        <pattern id="${id}p" width="56" height="56" patternUnits="userSpaceOnUse">
          <path d="M28 8 48 28 28 48 8 28Z" fill="none" stroke="${line}" stroke-opacity=".55" stroke-width="1.4"/>
          <circle cx="28" cy="28" r="3" fill="${line}" fill-opacity=".6"/>
          <circle cx="0" cy="0" r="2" fill="${line}" fill-opacity=".4"/><circle cx="56" cy="0" r="2" fill="${line}" fill-opacity=".4"/>
          <circle cx="0" cy="56" r="2" fill="${line}" fill-opacity=".4"/><circle cx="56" cy="56" r="2" fill="${line}" fill-opacity=".4"/>
        </pattern>
        <rect width="400" height="500" fill="url(#${id}p)"/>
        <rect width="400" height="64" fill="${bgB}" fill-opacity=".6"/>
        <rect y="436" width="400" height="64" fill="${bgB}" fill-opacity=".6"/>
        <path d="M0 64H400M0 72H400M0 428H400M0 436H400" stroke="${line}" stroke-width="1.5" stroke-opacity=".8"/>
        <path d="M0 500 400 150V500Z" fill="#fff" fill-opacity=".07"/>`;
                } else if (view === 'motif') {
                    body = `
        <path d="M52 470V230A148 148 0 0 1 348 230V470" fill="none" stroke="${line}" stroke-opacity=".5" stroke-width="1.5"/>

          <path d="M60 80c7 3 15 1 15 1s-2.5-9-9-12.5c-3.6-2-8-1-8-1"/>
          <path d="M60 96c-7 3-15 1-15 1s2.5-9 9-12.5c3.6-2 8-1 8-1"/>

                } else if (category === 'sarees') {

                    body = view === 'back'

            <path d="M120 90H280L292 450Q200 478 108 450Z"/>

                        : `<g ${g}>
            <path d="M130 90H270L292 450Q200 478 108 450Z"/>

          </g>`;
                } else if (category === 'lehengas') {
                    body = view === 'back'

            <path d="M168 96H232L246 170H154Z"/><path d="M180 96 200 140 220 96M200 140V170" fill="none"/>
            <path d="M150 214H250L252 232H148Z"/>
            <path d="M148 232H252L336 452Q200 486 64 452Z"/>
            <path d="M200 232V470M172 232 130 462M228 232 270 462" fill="none" stroke-opacity=".55"/>
