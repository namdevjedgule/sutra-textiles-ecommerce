<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <style>
    /* ===== Customer dashboard: Change password page only ===== */

    .dash-head {
      margin-bottom: 1.8rem;
    }

    .dash-head h1 {
      font-size: clamp(1.9rem, 3.4vw, 2.6rem);
    }

    .dash-head p {
      color: #4b5048;
      margin-top: 0.3rem;
    }

    .alert {
      padding: 0.85rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      border: 1px solid var(--grey);
      background: var(--ivory-soft);
    }

    .alert-success {
      border-left: 3px solid var(--olive);
    }

    .alert-error {
      border-left: 3px solid var(--terracotta);
    }

    .form-card {
      max-width: 520px;
      background: var(--ivory-soft);
      border: 1px solid var(--grey);
      padding: clamp(1.4rem, 3vw, 2.2rem);
    }

    .field+.field {
      margin-top: 1.3rem;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      margin-bottom: 0.35rem;
      color: var(--green);
    }

    .field-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      padding: 0.8rem 4.2rem 0.8rem 0.95rem;
      font-size: 0.95rem;
      background: var(--ivory);
      border: 1px solid var(--grey);
      border-radius: var(--radius);
      color: var(--charcoal);
      transition: border-color .2s var(--ease);
    }

    .field input:focus {
      border-color: var(--gold);
      outline: none;
    }

    .field input.has-error {
      border-color: var(--terracotta);
    }

    .toggle-pw {
      position: absolute;
      top: 50%;
      right: 0.8rem;
      transform: translateY(-50%);
      font-size: 0.78rem;
      color: var(--olive);
    }

    .toggle-pw:hover {
      color: var(--green);
    }

    .field .hint {
      display: block;
      font-size: 0.78rem;
      color: var(--olive);
      margin-top: 0.3rem;
    }

    .field .error {
      display: block;
      font-size: 0.78rem;
      color: var(--terracotta);
      margin-top: 0.3rem;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      margin-top: 1.8rem;
    }

    .form-actions .btn {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- change to match your existing navbar fragment name -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="dash-page">
    <div class="container dash-layout">

      <aside th:replace="~{customer/fragments/sidebar :: sidebar('password')}"></aside>

      <div class="dash-main">

        <header class="dash-head">
          <h1>Change password</h1>
          <p>Choose a new password for your account.</p>
        </header>

        <div class="alert alert-success" th:if="${message}" th:text="${message}" role="status"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}" role="alert"></div>

        <form class="form-card" id="pw-form" th:action="@{/customer/password}" th:object="${passwordForm}" method="post">

          <div class="field">
            <label for="currentPassword">Current password</label>
            <div class="field-wrap">
              <input id="currentPassword" type="password" th:field="*{currentPassword}" th:errorclass="has-error"
                autocomplete="current-password" required>
              <button type="button" class="toggle-pw" aria-label="Show or hide password">Show</button>
            </div>
            <span class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
          </div>

          <div class="field">
            <label for="newPassword">New password</label>
            <div class="field-wrap">
              <input id="newPassword" type="password" th:field="*{newPassword}" th:errorclass="has-error"
                autocomplete="new-password" minlength="8" required>
              <button type="button" class="toggle-pw" aria-label="Show or hide password">Show</button>
            </div>
            <span class="hint">Use at least 8 characters.</span>
            <span class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="field-wrap">
              <input id="confirmPassword" type="password" th:field="*{confirmPassword}" th:errorclass="has-error"
                autocomplete="new-password" required>
              <button type="button" class="toggle-pw" aria-label="Show or hide password">Show</button>
            </div>
            <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update password</button>
            <a th:href="@{/customer/profile}" class="btn-text">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- change to match your existing footer fragment name -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/script.js}"></script>
  <script>
    // Show / hide password
    document.querySelectorAll('.toggle-pw').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = btn.previousElementSibling;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
      });
    });

    // Confirm password must match (server checks again)
    var pw = document.getElementById('newPassword');
    var confirm = document.getElementById('confirmPassword');
    function check() {
      confirm.setCustomValidity(confirm.value && confirm.value !== pw.value ? 'Passwords do not match' : '');
    }
    pw.addEventListener('input', check);
    confirm.addEventListener('input', check);
  </script>

</body>

</html>
