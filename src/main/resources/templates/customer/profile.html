<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <style>
    /* ===== Customer dashboard: Profile page only ===== */

    .dash-head {
      margin-bottom: 1.8rem;
    }

    .dash-head h1 {
      font-size: clamp(1.9rem, 3.4vw, 2.6rem);
    }

    .dash-head p {
      color: #4b5048;
      margin-top: 0.3rem;
    }

    .alert {
      padding: 0.85rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      border: 1px solid var(--grey);
      background: var(--ivory-soft);
    }

    .alert-success {
      border-left: 3px solid var(--olive);
    }

    .alert-error {
      border-left: 3px solid var(--terracotta);
    }

    .form-card {
      max-width: 680px;
      background: var(--ivory-soft);
      border: 1px solid var(--grey);
      padding: clamp(1.4rem, 3vw, 2.2rem);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.3rem 1.2rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      margin-bottom: 0.35rem;
      color: var(--green);
    }

    .field input {
      width: 100%;
      padding: 0.8rem 0.95rem;
      font-size: 0.95rem;
      background: var(--ivory);
      border: 1px solid var(--grey);
      border-radius: var(--radius);
      color: var(--charcoal);
      transition: border-color .2s var(--ease);
    }

    .field input:focus {
      border-color: var(--gold);
      outline: none;
    }

    .field input[readonly] {
      background: transparent;
      color: var(--olive);
      cursor: not-allowed;
    }

    .field .hint {
      display: block;
      font-size: 0.78rem;
      color: var(--olive);
      margin-top: 0.3rem;
    }

    .field .error {
      display: block;
      font-size: 0.78rem;
      color: var(--terracotta);
      margin-top: 0.3rem;
    }

    .field input.has-error {
      border-color: var(--terracotta);
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      margin-top: 1.8rem;
    }

    .form-actions .btn {
      cursor: pointer;
    }

    @media (max-width: 540px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- change to match your existing navbar fragment name -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="dash-page">
    <div class="container dash-layout">

      <aside th:replace="~{customer/fragments/sidebar :: sidebar('profile')}"></aside>

      <div class="dash-main">

        <header class="dash-head">
          <h1>Profile</h1>
          <p>Update your name and phone number. These details are used for delivery updates.</p>
        </header>

        <div class="alert alert-success" th:if="${message}" th:text="${message}" role="status"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}" role="alert"></div>

        <form class="form-card" th:action="@{/customer/profile}" th:object="${profileForm}" method="post" novalidate>
          <div class="form-grid">

            <div class="field">
              <label for="firstName">First name</label>
              <input id="firstName" type="text" th:field="*{firstName}" th:errorclass="has-error" autocomplete="given-name" required>
              <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
            </div>

            <div class="field">
              <label for="lastName">Last name</label>
              <input id="lastName" type="text" th:field="*{lastName}" th:errorclass="has-error" autocomplete="family-name" required>
              <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
            </div>

            <div class="field full">
              <label for="email">Email</label>
              <input id="email" type="email" th:value="${user.email}" readonly>
              <span class="hint">Your email is your login, so it can't be changed here. Contact us if you need to change it.</span>
            </div>

            <div class="field full">
              <label for="phone">Phone number</label>
              <input id="phone" type="tel" th:field="*{phone}" th:errorclass="has-error" autocomplete="tel" inputmode="tel">
              <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a th:href="@{/customer/password}" class="btn-text">Change password</a>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- change to match your existing footer fragment name -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- base JS shared by the whole site; this page needs no extra JS -->
  <script th:src="@{/js/script.js}"></script>

</body>

</html>
